name: CI

on:
  # push:
  #   branches: 
  #     - feature_*
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链的**单一来源**是 `rust-toolchain.toml`：这里读出它的 channel 再交给 action。
      # 以前写死 `@stable`（不读那个文件，步骤名却叫 "Install Rust (rust-toolchain.toml)"），
      # 于是本地/CI/Docker 三个环境三套编译器，lint 漂移（只在某一个版本报）成了必然。
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "rust-toolchain.toml does not pin a channel"; exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust (${{ steps.toolchain.outputs.channel }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Toolchain pins agree
        run: ./scripts/check-toolchain.sh

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: License check (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # 用 nextest 而不是 cargo test：每条测试一个进程，各二进制之间能并行，
      # 而且不会把 `#[serial]` 的**等锁时间**算成测试运行时间（原来 CI 里那几条
      # "has been running for over 60 seconds" 多数只是排在队里等锁）。
      # e2e 的串行由 `.config/nextest.toml` 的 test-group 保证——nextest 下
      # `#[serial]` 的进程内锁会失效，这一条不能漏。
      # 注意：nextest **不跑 doctest**。当前仓库没有 doctest（src 里没有代码块），
      # 将来若加了，需要补一步 `cargo test --doc --workspace`。
      - name: Test
        run: cargo nextest run --workspace

      # 接线守卫（Phase 0）：`.config/nextest.toml` 用 filter='binary(e2e)' 保证 e2e 串行。
      # 把 tests/e2e 拆成多个二进制、改名、或删掉测试都会让这个 filter 匹配不到——
      # nextest 下 `#[serial]` 的进程内锁本来就失效，于是 64 条 QUIC 测试会静默并行。
      # 这条守卫把"改了线"变成 CI 红灯；条数变化时同步改 Makefile 的 E2E_TEST_COUNT。
      - name: e2e wiring guard
        run: make check-e2e-wiring

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type-check & build
        run: pnpm build
