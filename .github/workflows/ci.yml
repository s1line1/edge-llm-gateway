name: CI

on:
  # push:
  #   branches: 
  #     - feature_*
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `check-records` 要验证 TODO/REBUILD 里的「已修(<commit>)」声明；
          # 默认 depth=1 的 shallow clone 会让所有历史 hash 看起来都不存在。
          fetch-depth: 0

      # 工具链的**单一来源**是 `rust-toolchain.toml`：这里读出它的 channel 再交给 action。
      # 以前写死 `@stable`（不读那个文件，步骤名却叫 "Install Rust (rust-toolchain.toml)"），
      # 于是本地/CI/Docker 三个环境三套编译器，lint 漂移（只在某一个版本报）成了必然。
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "rust-toolchain.toml does not pin a channel"; exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust (${{ steps.toolchain.outputs.channel }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: License check (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # 单一来源：与本地 `make check-rust` 完全同一组检查（fmt / clippy / nextest /
      # e2e 接线 / toolchain / check-records）。不再在 YAML 里重复命令清单。
      # nextest 下 e2e 的串行由 `.config/nextest.toml` 的 test-group 保证，不能漏。
      - name: Run Rust gate
        run: make check-rust

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type-check & build
        run: pnpm build
